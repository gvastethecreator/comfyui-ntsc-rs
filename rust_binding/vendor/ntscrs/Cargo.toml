[package]
name = "ntsc-rs"
version = "0.1.2"
edition = "2024"
license = "MIT OR ISC OR Apache-2.0"
repository = "https://github.com/valadaptive/ntsc-rs/tree/main/crates/ntscrs"

[dependencies]
rand = { version = "0.10.2", default-features = false }
rand_xoshiro = "0.8.1"
fearless_simd = "0.6.0"
num_enum = { version = "0.7.6", default-features = false }
ntsc-rs-macros = {path = "../macros"}
siphasher = "1.0.3"
hifijson = "0.5.0"
rayon-core = { version = "1.13.0", optional = true }
num_cpus = { version = "1.17.0", optional = true }
sval = { version = "2.21.1", features = ["std"] }
sval_json = { version = "2.21.1", features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[features]
default = ["rayon"]
rayon = ["dep:rayon-core", "dep:num_cpus"]

[[bench]]
name = "filter_profile"
harness = false
