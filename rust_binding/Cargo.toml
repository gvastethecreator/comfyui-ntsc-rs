[package]
name = "comfyui_ntsc_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
numpy = "0.21"
ntsc-rs = { path = "vendor/ntscrs" }
image = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1