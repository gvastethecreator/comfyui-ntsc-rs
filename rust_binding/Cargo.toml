[package]
name = "comfyui_ntsc_rs"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
numpy = "0.30.0"
ntsc-rs = { path = "vendor/ntscrs" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
