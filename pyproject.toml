[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "comfyui-ntsc-rs"
version = "0.1.0"
description = "Native NTSC/VHS/CRT effect processing for ComfyUI"
readme = "README.md"
license = {text = "MIT OR ISC OR Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "ComfyUI NTSC-RS Contributors"}
]
keywords = ["comfyui", "ntsc", "vhs", "crt", "video-effects", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/comfyui-ntscrs"
Repository = "https://github.com/YOUR_USERNAME/comfyui-ntscrs"
Documentation = "https://github.com/YOUR_USERNAME/comfyui-ntscrs#readme"

[project.optional-dependencies]
dev = [
    "maturin>=1.0",
    "torch",
    "numpy",
]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "rust_binding/Cargo.toml"
