# Custom node metadata for the Comfy Registry and ComfyUI-Manager.
# The native wheel is built from rust_binding/pyproject.toml (maturin), not from this file.

[project]
name = "comfyui-ntsc-rs"
version = "0.2.0"
description = "Analog NTSC/VHS/CRT effects for ComfyUI images, powered by the ntsc-rs Rust engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.25"]  # Keep in sync with requirements.txt (ComfyUI-Manager).
keywords = ["comfyui", "ntsc", "vhs", "crt", "analog", "retro", "rust"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://gvastethecreator.github.io/comfyui-ntsc-rs/"
Repository = "https://github.com/gvastethecreator/comfyui-ntsc-rs"
Documentation = "https://gvastethecreator.github.io/comfyui-ntsc-rs/"
Issues = "https://github.com/gvastethecreator/comfyui-ntsc-rs/issues"
"Bug Tracker" = "https://github.com/gvastethecreator/comfyui-ntsc-rs/issues"

[tool.comfy]
PublisherId = "gvastethecreator"
DisplayName = "NTSC-RS (VHS / CRT / analog video)"
Icon = "https://raw.githubusercontent.com/gvastethecreator/comfyui-ntsc-rs/main/docs/assets/icon.png"
requires-comfyui = ">=0.3.48"
# Prebuilt native binaries, git-ignored, placed by the publish workflow.
includes = ["native"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
