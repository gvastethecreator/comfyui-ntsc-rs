name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-quality:
    name: Python ${{ matrix.python }} and Rust
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install quality and build dependencies
        run: python -m pip install -r requirements.txt ruff==0.16.3

      - name: Run source quality gates
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: python scripts/verify.py

      - name: Build and install development wheel
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: python build_node.py --dev --install --python python

      - name: Run native boundary smoke
        run: python scripts/native_smoke.py
