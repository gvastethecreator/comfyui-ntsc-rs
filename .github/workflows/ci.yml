name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-quality:
    name: Python ${{ matrix.python }} and Rust
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install quality and build dependencies
        run: python -m pip install -r requirements.txt maturin==1.16.0 ruff==0.17.3

      - name: Run source quality gates
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: python scripts/verify.py

      - name: Build development wheel into native/
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
        run: python build_node.py --dev --python python

      - name: Run native boundary smoke
        run: python scripts/native_smoke.py
