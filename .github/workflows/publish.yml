name: Publish to Comfy Registry

# Manual on purpose: run it after the GitHub release for this version is published.
# It bundles that release's binaries into native/ (see [tool.comfy] includes) so
# registry installs work offline, then publishes with the REGISTRY_ACCESS_TOKEN secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'gvastethecreator'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bundle release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          gh release download "v$version" --pattern "comfyui_ntsc_rs-$version-*" --dir native
          ls -l native

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@7578cdb0c1410f2515e6f9b1443c6859cab94f05 # 1.0.1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
